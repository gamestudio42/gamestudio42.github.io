# Trusted default-branch workflow. PR builds have read-only permissions; this job
# only publishes their static artifact and never checks out or executes PR code.
name: Pages preview

on:
  workflow_run:
    workflows: [Pull request checks]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate current PR and artifact
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            if (context.eventName === 'pull_request_target') {
              const number = context.payload.pull_request.number;
              const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: number });
              if (pr.state !== 'closed') return;
              core.setOutput('number', number);
              core.setOutput('mode', 'remove');
              return;
            }
            const run = context.payload.workflow_run;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...repo, run_id: run.id });
            const candidates = artifacts.filter(a => /^preview-pr-[1-9][0-9]*$/.test(a.name) && !a.expired);
            if (candidates.length !== 1) throw new Error('Expected one PR preview artifact');
            const number = Number(candidates[0].name.slice('preview-pr-'.length));
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: number });
            const { previewPlan } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview-plan.mjs`);
            const plan = previewPlan(run, artifacts, pr);
            if (!plan) return;
            core.setOutput('number', plan.number);
            core.setOutput('artifact', plan.artifactId);
            core.setOutput('mode', 'deploy');
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: steps.plan.outputs.mode == 'deploy'
        with:
          artifact-ids: ${{ steps.plan.outputs.artifact }}
          merge-multiple: true
          path: preview-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check static artifact
        if: steps.plan.outputs.mode == 'deploy'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('preview-site')
          assert (root / 'index.html').is_file(), 'Missing preview index'
          for path in root.rglob('*'):
              assert not path.is_symlink() and '.git' not in path.parts, 'Unsafe artifact entry'
          PY
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1
        if: steps.plan.outputs.mode != ''
        with:
          source-dir: preview-site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pr-number: ${{ steps.plan.outputs.number }}
          action: ${{ steps.plan.outputs.mode }}
          comment: false
      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        if: steps.plan.outputs.mode == 'deploy'
        with:
          header: pr-preview
          number: ${{ steps.plan.outputs.number }}
          message: |
            Preview: https://gamestudio42.github.io/pr-preview/pr-${{ steps.plan.outputs.number }}/
            Português: https://gamestudio42.github.io/pr-preview/pr-${{ steps.plan.outputs.number }}/pt/

            A publicação fica disponível após o workflow [Pages deploy](https://github.com/gamestudio42/gamestudio42.github.io/actions/workflows/pages-deploy.yml) concluir. Atualizada a cada commit validado e removida ao fechar o PR.
      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        if: steps.plan.outputs.mode == 'remove'
        with:
          header: pr-preview
          number: ${{ steps.plan.outputs.number }}
          message: Preview removida porque o PR foi fechado.
